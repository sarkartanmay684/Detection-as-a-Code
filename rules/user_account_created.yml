title: Linux Local User Account Created
id: d9a07e2f-6cec-4c23-a0a9-f00664c1cc49
status: test
description: Detects Linux local account creation recorded by useradd or Auditd.
author: Tanmay Sarkar
date: 2026-08-31
references:
  - https://attack.mitre.org/techniques/T1136/001/
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  product: linux
  definition: Linux system or audit logs must be collected with the full event stored in the message field.
detection:
  selection_useradd:
    message|contains: 'new user: name='
  selection_auditd:
    message|contains: 'type=ADD_USER'
  condition: 1 of selection_*
falsepositives:
  - Normal employee onboarding or administrator-created accounts
  - Configuration-management and provisioning tools creating approved accounts
  - Package installation creating a legitimate service account
  - Authorized laboratory or penetration-testing activity
level: medium
