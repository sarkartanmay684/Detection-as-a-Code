title: SSH Password Spraying Against Multiple Accounts
id: dff85776-26fd-4942-8329-7b122b620148
name: linux_ssh_password_spray
status: test
description: Detects failed SSH authentication attempts from one source IP against at least five distinct accounts within ten minutes.
author: Tanmay Sarkar
date: 2026-08-31
references:
  - https://attack.mitre.org/techniques/T1110/003/
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - linux_ssh_failed_authentication
  group-by:
    - src_ip
  timespan: 10m
  condition:
    field: user
    gte: 5
falsepositives:
  - Authorized password-spray simulations or penetration tests
  - Authentication testing from a vulnerability scanner
  - A shared jump server generating failures for several legitimate users
  - Misconfigured automation trying outdated credentials for several accounts
level: medium
